# Pickless: every push to `pickless` is a release (the in-app updater picks it up within an hour).
# Pushes to claude/* session branches only build and test.
name: Pickless

on:
  push:
    branches: [pickless, 'claude/**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pickless-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/pickless' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PICKLESS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Core tests (knowledge base, analyzer, detective, coach)
        run: ./gradlew --no-daemon :core:test

      - name: App tests (Robolectric, with screenshots)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint and build the signed APK
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease

      - name: Keep test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickless-reports-${{ github.run_number }}
          path: |
            core/build/reports/tests
            app/build/reports
            build/screenshots
          retention-days: 14

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: pickless-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish release and update the channel manifest
        if: github.ref == 'refs/heads/pickless'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION).${{ github.run_number }}"
          TAG="pickless-v$VERSION"
          APK="Pickless-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          ENDPOINT=$(tr -d '[:space:]' < suggestions/endpoint.txt 2>/dev/null || true)
          NOTES=$(git log -1 --format=%s)
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$APK"
          python3 - "$VERSION" "${{ github.run_number }}" "$URL" "$SHA" "$SIZE" "$ENDPOINT" "$NOTES" > manifest.json <<'PY'
          import json, sys, datetime
          version, code, url, sha, size, endpoint, notes = sys.argv[1:8]
          print(json.dumps({
              "app": "pickless", "version": version, "versionCode": int(code),
              "apk": {"url": url, "sha256": sha, "size": int(size)},
              "minSdk": 26, "notes": notes,
              "published": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "suggestions": {"endpoint": endpoint or None},
          }, indent=2))
          PY
          gh release create "$TAG" "$APK" --title "Pickless $VERSION" --notes "$NOTES" --prerelease --latest=false --target "$GITHUB_SHA"
          if ! gh release view pickless-channel > /dev/null 2>&1; then
            gh release create pickless-channel --title "Pickless update channel" \
              --notes "Always the newest Pickless: download Pickless.apk below to install. manifest.json is what the in-app updater reads." \
              --prerelease --latest=false --target "$GITHUB_SHA"
          fi
          cp "$APK" Pickless.apk
          gh release upload pickless-channel manifest.json Pickless.apk --clobber
          echo "Published $TAG ($SHA)"
