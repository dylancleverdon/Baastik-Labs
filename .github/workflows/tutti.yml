name: Tutti

# Builds Tutti for Apple Silicon Macs and Windows and runs only the checks that match what
# changed. Pushes to the `tutti` branch also publish: tutti-v<version> (prerelease, never
# "Latest") and the rolling tutti-channel release that the install links and every installed
# Tutti's updater read. Nothing is published unless every check that ran passed. Changes to
# docs alone run nothing and publish nothing. No secrets are needed.

on:
  push:
    branches: ["tutti", "claude/**"]
    paths-ignore: ["**/*.md", "docs/**", "suggestions/Code.gs", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "suggestions/Code.gs", ".gitignore"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release from this run
        type: boolean
        default: false

# No run-wide lock: a newer push cancels an older run's builds (it contains their changes), but a
# release that's already publishing is never interrupted (see the jobs' own concurrency).

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  plan:
    runs-on: ubuntu-24.04   # a few seconds of bookkeeping, not a build
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      cpp: ${{ steps.plan.outputs.cpp }}
      script: ${{ steps.plan.outputs.script }}
      e2e: ${{ steps.plan.outputs.e2e }}
      app: ${{ steps.plan.outputs.app }}
      plugin: ${{ steps.plan.outputs.plugin }}
      build_app: ${{ steps.plan.outputs.build_app }}
      build_plugin: ${{ steps.plan.outputs.build_plugin }}
      updater: ${{ steps.plan.outputs.updater }}
      mac: ${{ steps.plan.outputs.mac }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          BUILD="${{ github.run_number }}"
          VERSION="$(head -n1 VERSION | tr -d '[:space:]').$BUILD"
          PUBLISH=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/tutti" ]]; then PUBLISH=true; fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then PUBLISH=true; fi

          # What changed since the last run of this branch decides which checks run.
          ALL=false
          CHANGED=""
          BEFORE="${{ github.event.before }}"
          LAST_RELEASE="$(git describe --tags --abbrev=0 --match 'tutti-v*' HEAD 2>/dev/null || true)"
          if [[ $PUBLISH == true ]]; then
            # A release checks everything since the last published release, so changes from a run
            # that failed or was cancelled are never skipped.
            if [[ -n "$LAST_RELEASE" ]]; then CHANGED="$(git diff --name-only "$LAST_RELEASE" HEAD)"; else ALL=true; fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          elif [[ "${{ github.event_name }}" == "push" && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE" HEAD)"
          else
            ALL=true   # a new branch or a run started by hand: check everything
          fi
          if grep -q '^\.github/' <<< "$CHANGED"; then ALL=true; fi
          # A commit that is already on tutti gets checked by its release run, not twice.
          SKIP=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != "refs/heads/tutti" ]] \
             && [[ "$(git ls-remote origin refs/heads/tutti | cut -f1)" == "$GITHUB_SHA" ]]; then SKIP=true; fi
          flag() {
            if $SKIP; then echo false; elif $ALL || grep -qE "$1" <<< "$CHANGED"; then echo true; else echo false; fi
          }
          CPP=$(flag '^(core|engine|tests|cmake)/|^CMakeLists\.txt$|^VERSION$')
          SCRIPT=$(flag '^remote_script/')
          E2E=$(flag '^(core|engine|remote_script|tools)/')
          APP=$(flag '^(app|core|engine|cmake)/|^CMakeLists\.txt$|^VERSION$')
          PLUGIN=$(flag '^(plugin|cmake)/|^core/src/Protocol\.cpp$|^core/include/tutti/Protocol\.h$|^CMakeLists\.txt$')
          PACKAGING=$(flag '^(packaging|tools/release)/')
          UPDATER=$(flag '^app/Source/(AppUpdater|Main)|^core/src/Update\.cpp$|^core/include/tutti/Update\.h$|^(packaging|tools/release)/')
          BUILD_APP=false; BUILD_PLUGIN=false
          if [[ $PUBLISH == true || $APP == true || $PACKAGING == true ]]; then BUILD_APP=true; fi
          if [[ $PUBLISH == true || $PLUGIN == true ]]; then BUILD_PLUGIN=true; fi
          MAC=false; WINDOWS=false
          if [[ $BUILD_APP == true || $BUILD_PLUGIN == true || $CPP == true || $SCRIPT == true || $E2E == true ]]; then MAC=true; fi
          if [[ $BUILD_APP == true || $BUILD_PLUGIN == true || $CPP == true ]]; then WINDOWS=true; fi

          {
            echo "version=$VERSION"; echo "build=$BUILD"; echo "publish=$PUBLISH"
            echo "cpp=$CPP"; echo "script=$SCRIPT"; echo "e2e=$E2E"; echo "app=$APP"; echo "plugin=$PLUGIN"
            echo "build_app=$BUILD_APP"; echo "build_plugin=$BUILD_PLUGIN"; echo "updater=$UPDATER"
            echo "mac=$MAC"; echo "windows=$WINDOWS"
          } >> "$GITHUB_OUTPUT"
          echo "Tutti $VERSION (publish: $PUBLISH, last release: ${LAST_RELEASE:-none})"
          echo "Changed:"; sed 's/^/  /' <<< "${CHANGED:-  (everything)}"
          echo "Checks: core=$CPP script=$SCRIPT e2e=$E2E app=$APP plugin=$PLUGIN updater=$UPDATER (skip: $SKIP)"

  macos:
    name: macOS (Apple Silicon) build, checks and package
    needs: plan
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-15
    concurrency:
      group: tutti-macos-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      # Reuse what was compiled last time (JUCE barely changes): most of the build time.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tutti-macos-arm64
          max-size: 2G

      - uses: actions/setup-python@v5
        if: needs.plan.outputs.script == 'true' || needs.plan.outputs.e2e == 'true'
        with:
          python-version: "3.11" # the Python inside Live 12

      - name: Remote Script tests (fake Live)
        if: needs.plan.outputs.script == 'true'
        run: |
          python -m pip install --quiet pytest
          python -m pytest remote_script/tests -q

      - name: Configure (Apple Silicon)
        if: needs.plan.outputs.build_app == 'true' || needs.plan.outputs.build_plugin == 'true' || needs.plan.outputs.cpp == 'true' || needs.plan.outputs.e2e == 'true'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache
          -DTUTTI_BUILD_APP=${{ needs.plan.outputs.build_app == 'true' && 'ON' || 'OFF' }}
          -DTUTTI_BUILD_PLUGIN=${{ needs.plan.outputs.build_plugin == 'true' && 'ON' || 'OFF' }}
          -DTUTTI_BUILD_TESTS=${{ needs.plan.outputs.cpp == 'true' && 'ON' || 'OFF' }}
          -DTUTTI_BUILD_TOOLS=${{ needs.plan.outputs.e2e == 'true' && 'ON' || 'OFF' }}
          -DTUTTI_BUILD_NUMBER=${BUILD} -DTUTTI_COMMIT=${{ github.sha }}

      - name: Build
        if: needs.plan.outputs.build_app == 'true' || needs.plan.outputs.build_plugin == 'true' || needs.plan.outputs.cpp == 'true' || needs.plan.outputs.e2e == 'true'
        run: cmake --build build

      - name: Core tests
        if: needs.plan.outputs.cpp == 'true'
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end (three Tuttis, real Remote Script, fake Lives)
        if: needs.plan.outputs.e2e == 'true'
        run: |
          python -m pip install --quiet pytest   # the fake Live's helpers import it
          python tools/e2e/run_e2e.py build

      - name: Stage and sign the payload
        if: needs.plan.outputs.build_app == 'true'
        run: |
          PAYLOAD="dist/payload"
          mkdir -p "$PAYLOAD"
          ditto build/app/Tutti_artefacts/Release/Tutti.app "$PAYLOAD/Tutti.app"
          test -f "$PAYLOAD/Tutti.app/Contents/Resources/RemoteScript/Tutti/__init__.py"
          PLUGINS=build/plugin/TuttiStandIn_artefacts/Release
          [ -d "$PLUGINS/VST3/Tutti Stand-in.vst3" ] && ditto "$PLUGINS/VST3/Tutti Stand-in.vst3" "$PAYLOAD/Tutti Stand-in.vst3"
          [ -d "$PLUGINS/AU/Tutti Stand-in.component" ] && ditto "$PLUGINS/AU/Tutti Stand-in.component" "$PAYLOAD/Tutti Stand-in.component"
          for item in "$PAYLOAD"/*; do
            codesign --force --deep --sign - "$item"
            codesign --verify --deep --strict "$item"
          done
          # Re-sign the app with a designated requirement that names its bundle id instead of
          # this build's hash, so macOS keeps Tutti's Accessibility permission (used to press
          # Save in Live) across updates.
          codesign --force --sign - --identifier com.baastiklabs.tutti \
            --requirements '=designated => identifier "com.baastiklabs.tutti"' "$PAYLOAD/Tutti.app"
          codesign --verify --deep --strict "$PAYLOAD/Tutti.app"
          codesign -d -r- "$PAYLOAD/Tutti.app" 2>&1 | grep -q 'identifier "com.baastiklabs.tutti"' \
            || { echo "the app's designated requirement isn't the bundle id"; exit 1; }
          ls -la "$PAYLOAD"

      - name: Package (installer + update zip)
        if: needs.plan.outputs.build_app == 'true'
        run: |
          mkdir -p out
          packaging/macos/build_pkg.sh dist/payload "$VERSION" out
          (cd dist/payload && ditto -c -k --sequesterRsrc . "../../out/Tutti-${VERSION}-mac.zip")
          ls -la out

      - name: Installer smoke test
        if: needs.plan.outputs.build_app == 'true'
        run: |
          export TUTTI_NO_LAUNCH=1
          installer -pkg out/Tutti-Installer.pkg -target CurrentUserHomeDirectory
          test -d "$HOME/Applications/Tutti.app"
          pkill -x Tutti 2>/dev/null || true

      - name: Screenshots from the installed app
        if: needs.plan.outputs.app == 'true'
        continue-on-error: true
        run: |
          mkdir -p shots
          "$HOME/Applications/Tutti.app/Contents/MacOS/Tutti" --screenshot "$PWD/shots" &
          pid=$!
          for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la shots

      - name: Opening Tutti again brings its window back (Dock icon, Finder, Spotlight)
        if: needs.plan.outputs.app == 'true'
        run: |
          APP="$HOME/Applications/Tutti.app"
          LOG="$HOME/Library/Logs/Tutti/tutti.log"
          pkill -x Tutti 2>/dev/null || true
          open -g "$APP" --args --background
          for i in $(seq 1 20); do pgrep -x Tutti >/dev/null && break; sleep 1; done
          sleep 3
          open "$APP"   # what clicking the Dock icon does when Tutti is running
          for i in $(seq 1 20); do grep -q "reopened: showing the window" "$LOG" 2>/dev/null && break; sleep 1; done
          [ "$(pgrep -x Tutti | wc -l | tr -d ' ')" = "1" ] || { echo "::error::expected one Tutti"; pgrep -fl Tutti; exit 1; }
          grep -q "reopened: showing the window" "$LOG" || { echo "::error::reopening didn't show the window"; tail -20 "$LOG"; exit 1; }
          echo "Reopening shows the window"
          pkill -x Tutti || true

      - name: auval and pluginval (Stand-in)
        if: needs.plan.outputs.plugin == 'true'
        run: |
          PLUGINS=build/plugin/TuttiStandIn_artefacts/Release
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components" "$HOME/Library/Audio/Plug-Ins/VST3"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Tutti Stand-in.component" "$HOME/Library/Audio/Plug-Ins/VST3/Tutti Stand-in.vst3"
          ditto "$PLUGINS/AU/Tutti Stand-in.component" "$HOME/Library/Audio/Plug-Ins/Components/Tutti Stand-in.component"
          ditto "$PLUGINS/VST3/Tutti Stand-in.vst3" "$HOME/Library/Audio/Plug-Ins/VST3/Tutti Stand-in.vst3"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx TtSi Bstk
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          ditto -x -k pluginval.zip pluginval
          pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
            --validate "$HOME/Library/Audio/Plug-Ins/VST3/Tutti Stand-in.vst3"

      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.build_app == 'true'
        with:
          name: tutti-mac
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.app == 'true'
        with:
          name: tutti-screens-mac
          path: shots/
          if-no-files-found: ignore

  windows:
    name: Windows build, checks and package
    needs: plan
    concurrency:
      group: tutti-windows-${{ github.ref }}
      cancel-in-progress: true
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -A x64 -DTUTTI_BUILD_TOOLS=OFF
          -DTUTTI_BUILD_APP=${{ needs.plan.outputs.build_app == 'true' && 'ON' || 'OFF' }}
          -DTUTTI_BUILD_PLUGIN=${{ needs.plan.outputs.build_plugin == 'true' && 'ON' || 'OFF' }}
          -DTUTTI_BUILD_TESTS=${{ needs.plan.outputs.cpp == 'true' && 'ON' || 'OFF' }}
          -DTUTTI_BUILD_NUMBER=${BUILD} -DTUTTI_COMMIT=${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core tests
        if: needs.plan.outputs.cpp == 'true'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage the payload
        if: needs.plan.outputs.build_app == 'true'
        run: |
          PAYLOAD=dist/payload
          mkdir -p "$PAYLOAD"
          ART=build/app/Tutti_artefacts/Release
          cp "$ART/Tutti.exe" "$PAYLOAD/"
          cp -R "$ART/RemoteScript" "$PAYLOAD/RemoteScript"
          test -f "$PAYLOAD/RemoteScript/Tutti/__init__.py"
          VST3="build/plugin/TuttiStandIn_artefacts/Release/VST3/Tutti Stand-in.vst3"
          [ -d "$VST3" ] && cp -R "$VST3" "$PAYLOAD/"
          ls -la "$PAYLOAD"

      - name: Package (installer + update zip)
        if: needs.plan.outputs.build_app == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist\payload\* -DestinationPath "out\Tutti-$env:VERSION-windows.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/DPayload=$env:GITHUB_WORKSPACE\dist\payload" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\out" "/DOutputName=Tutti-Installer" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out

      - name: Installer smoke test (install, check, uninstall)
        if: needs.plan.outputs.build_app == 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out\Tutti-Installer.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "installer exited with $($p.ExitCode)" }
          $app = Join-Path $env:ProgramFiles "Baastik Labs\Tutti"
          if (-not (Test-Path "$app\Tutti.exe")) { throw "Tutti.exe wasn't installed" }
          if (-not (Test-Path "$app\RemoteScript\Tutti\__init__.py")) { throw "the Remote Script wasn't installed" }
          $vst3 = Join-Path $env:CommonProgramFiles "VST3\Tutti Stand-in.vst3"
          if ((Test-Path "dist\payload\Tutti Stand-in.vst3") -and -not (Test-Path "$vst3\Contents\x86_64-win\Tutti Stand-in.vst3")) { throw "the Stand-in wasn't installed" }
          # Tutti updates itself without admin rights: what it replaces must be changeable by Users.
          $mustBeWritable = @($app, "$app\Tutti.exe", "$app\RemoteScript\Tutti\__init__.py")
          if (Test-Path $vst3) { $mustBeWritable += @($vst3, "$vst3\Contents\x86_64-win\Tutti Stand-in.vst3") }
          foreach ($path in $mustBeWritable) {
            $writable = (Get-Acl $path).Access | Where-Object { $_.IdentityReference -like "*\Users" -and $_.FileSystemRights -match "Modify|FullControl" -and $_.AccessControlType -eq "Allow" }
            if (-not $writable) { (Get-Acl $path).Access | Format-Table | Out-String | Write-Host; throw "$path isn't writable by Users" }
          }
          $rule = netsh advfirewall firewall show rule name=Tutti verbose | Out-String
          Write-Host $rule
          if ($rule -notmatch "47380" -or $rule -notmatch "100\.64\.0\.0") { throw "the firewall rule is missing or wrong" }

          Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # The uninstaller hands over to a copy of itself in TEMP: wait for it to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { Get-ChildItem -Recurse $app | Out-String | Write-Host; throw "the app folder is still there after uninstalling" }
          if (Test-Path $vst3) { throw "the Stand-in is still there after uninstalling" }
          netsh advfirewall firewall show rule name=Tutti | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the firewall rule is still there after uninstalling" }
          $global:LASTEXITCODE = 0
          Write-Host "Install and uninstall OK"

      - name: Screenshots
        if: needs.plan.outputs.app == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $p = Start-Process -FilePath "dist\payload\Tutti.exe" -ArgumentList "--screenshot", "$env:GITHUB_WORKSPACE\shots" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill() }
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.build_app == 'true'
        with:
          name: tutti-windows
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.app == 'true'
        with:
          name: tutti-screens-windows
          path: shots/
          if-no-files-found: ignore

  # Self-update tests (only when the updater or packaging changed): an old Tutti (build 0) built
  # from this commit updates itself from the published tutti-channel release, exactly as installed
  # copies do. They test this commit's updater, so they don't gate publishing (a broken published
  # build must never block its fix).
  mac-update-test:
    name: macOS self-update from the published release
    needs: plan
    if: needs.plan.outputs.updater == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Is there a published release to update to?
        id: channel
        run: |
          if curl -fsSL -o manifest.json "https://github.com/${{ github.repository }}/releases/download/tutti-channel/tutti-update.json"; then
            cat manifest.json
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Tutti release is published yet, so there's nothing to update to."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build an old Tutti (build 0) from this commit
        if: steps.channel.outputs.ready == 'true'
        run: |
          command -v ninja || brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DTUTTI_BUILD_TESTS=OFF -DTUTTI_BUILD_TOOLS=OFF -DTUTTI_BUILD_PLUGIN=OFF -DTUTTI_BUILD_NUMBER=0
          cmake --build build --target Tutti

      - name: Let it update itself, then check
        if: steps.channel.outputs.ready == 'true'
        run: |
          WANT_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          WANT_BUILD=$(python3 -c "import json; print(json.load(open('manifest.json'))['build'])")
          APP="$HOME/Applications/Tutti.app"
          DATA="$HOME/Library/Application Support/Tutti"
          pkill -x Tutti 2>/dev/null || true
          rm -rf "$APP" "$DATA" "$HOME/Library/Logs/Tutti"
          mkdir -p "$HOME/Applications"
          ditto build/app/Tutti_artefacts/Release/Tutti.app "$APP"
          OLD_VERSION=$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)
          echo "Old Tutti $OLD_VERSION; the channel has $WANT_VERSION (build $WANT_BUILD)"
          open "$APP" --args --background
          # The first check runs a minute after launch.
          for i in $(seq 1 60); do
            sleep 5
            NOW=$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "?")
            if [ "$NOW" = "$WANT_VERSION" ] && lsof -nP -iTCP:47381 -sTCP:LISTEN >/dev/null 2>&1; then break; fi
          done
          sleep 3
          echo "--- updater.log"; cat "$HOME/Library/Logs/Tutti/updater.log" || true
          echo "--- processes"; pgrep -fl "MacOS/Tutti" || true
          echo "--- listening"; lsof -nP -iTCP:47381 -sTCP:LISTEN || true
          fail() { echo "::error::$1"; exit 1; }
          [ "$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)" = "$WANT_VERSION" ] || fail "Tutti wasn't updated to $WANT_VERSION"
          python3 -c "import json,sys; b=json.load(open(sys.argv[1]))['build']; sys.exit(0 if b == int(sys.argv[2]) else 1)" "$DATA/installed.json" "$WANT_BUILD" || fail "installed.json doesn't record build $WANT_BUILD"
          [ "$(defaults read "$DATA/previous/Tutti.app/Contents/Info.plist" CFBundleShortVersionString)" = "$OLD_VERSION" ] || fail "the old version wasn't kept for Roll back"
          [ "$(pgrep -f "MacOS/Tutti" | wc -l | tr -d ' ')" = "1" ] || fail "expected exactly one Tutti running"
          pgrep -f "MacOS/Tutti.*--updated" >/dev/null || fail "the running Tutti isn't the relaunched one"
          LISTENER=$(lsof -nP -t -iTCP:47381 -sTCP:LISTEN | head -n1)
          [ "$LISTENER" = "$(pgrep -f "MacOS/Tutti.*--updated")" ] || fail "the relaunched Tutti isn't listening for Live"
          codesign --verify --deep --strict "$APP" || fail "the updated app's signature is broken"
          echo "Updated $OLD_VERSION -> $WANT_VERSION and relaunched"
          pkill -x Tutti || true

  windows-update-test:
    name: Windows self-update from the published release
    needs: plan
    if: needs.plan.outputs.updater == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there a published release to update to?
        id: channel
        shell: bash
        run: |
          if curl -fsSL -o manifest.json "https://github.com/${{ github.repository }}/releases/download/tutti-channel/tutti-update.json"; then
            cat manifest.json
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Tutti release is published yet, so there's nothing to update to."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build an old Tutti (build 0) from this commit
        if: steps.channel.outputs.ready == 'true'
        shell: bash
        run: |
          cmake -S . -B build -A x64 -DTUTTI_BUILD_TESTS=OFF -DTUTTI_BUILD_TOOLS=OFF -DTUTTI_BUILD_PLUGIN=OFF -DTUTTI_BUILD_NUMBER=0
          cmake --build build --config Release --target Tutti --parallel

      - name: Let it update itself, then check
        if: steps.channel.outputs.ready == 'true'
        shell: pwsh
        run: |
          $m = Get-Content manifest.json -Raw | ConvertFrom-Json
          # Install the published Tutti the way a friend would, then put the old build in its place.
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/tutti-channel/Tutti-Installer.exe" -OutFile Tutti-Installer.exe
          $p = Start-Process .\Tutti-Installer.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the published installer failed" }
          Get-Process Tutti -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Join-Path $env:ProgramFiles "Baastik Labs\Tutti"
          $data = Join-Path $env:LOCALAPPDATA "Tutti"
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          Copy-Item build\app\Tutti_artefacts\Release\Tutti.exe "$app\Tutti.exe" -Force
          $oldHash = (Get-FileHash "$app\Tutti.exe").Hash

          # What the update should install.
          Invoke-WebRequest -Uri $m.platforms.windows.url -OutFile published.zip
          Expand-Archive published.zip -DestinationPath published
          $wantHash = (Get-FileHash published\Tutti.exe).Hash

          Start-Process "$app\Tutti.exe" -ArgumentList "--background"
          # The first check runs a minute after launch.
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 5
            $hash = (Get-FileHash "$app\Tutti.exe" -ErrorAction SilentlyContinue).Hash
            $listening = Get-NetTCPConnection -LocalPort 47381 -State Listen -ErrorAction SilentlyContinue
          } until (($hash -eq $wantHash -and $listening) -or (Get-Date) -gt $deadline)
          Start-Sleep -Seconds 3

          Write-Host "--- updater.log"; Get-Content "$data\Logs\updater.log" -ErrorAction SilentlyContinue
          $procs = @(Get-CimInstance Win32_Process -Filter "Name='Tutti.exe'")
          Write-Host "--- processes"; $procs | Format-Table ProcessId, ExecutablePath, CommandLine -AutoSize | Out-String -Width 300 | Write-Host
          $listening = @(Get-NetTCPConnection -LocalPort 47381 -State Listen -ErrorAction SilentlyContinue)
          Write-Host "--- listening"; $listening | Format-Table | Out-String | Write-Host

          if ((Get-FileHash "$app\Tutti.exe").Hash -ne $wantHash) { throw "Tutti.exe wasn't replaced by the published one" }
          if ((Get-Content "$data\installed.json" -Raw | ConvertFrom-Json).build -ne $m.build) { throw "installed.json doesn't record build $($m.build)" }
          if ((Get-FileHash "$data\previous\Tutti.exe").Hash -ne $oldHash) { throw "the old version wasn't kept for Roll back" }
          if (Test-Path "published\Tutti Stand-in.vst3") {
            $dll = "Tutti Stand-in.vst3\Contents\x86_64-win\Tutti Stand-in.vst3"
            if (-not (Test-Path (Join-Path $env:CommonProgramFiles "VST3\$dll"))) { throw "the Stand-in is missing after the update" }
            if (-not (Test-Path "$data\previous\$dll")) { throw "the Stand-in wasn't updated file by file" }
          }
          if ($procs.Count -ne 1) { throw "expected exactly one Tutti running, found $($procs.Count)" }
          if ($procs[0].CommandLine -notmatch "--updated") { throw "the running Tutti isn't the relaunched one" }
          if ($listening.Count -lt 1 -or $listening[0].OwningProcess -ne $procs[0].ProcessId) { throw "the relaunched Tutti isn't listening for Live" }
          Write-Host "Updated and relaunched"
          Stop-Process -Id $procs[0].ProcessId -Force

  publish:
    name: Publish release
    needs: [plan, macos, windows]
    concurrency:
      group: tutti-publish-${{ github.ref }}
      cancel-in-progress: false
    if: needs.plan.outputs.publish == 'true' && needs.macos.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04   # uploads the release; builds nothing
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: tutti-mac
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: tutti-windows
          path: out

      - name: Release notes
        run: |
          git fetch --tags --force --quiet
          PREV="$(git tag --list 'tutti-v*' --sort=-creatordate | head -n1)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi  # first release: everything
          git log --no-merges --pretty='- %s' -n 15 $RANGE > notes.md || true
          [ -s notes.md ] || echo "- Improvements" > notes.md
          cat notes.md

      - name: Publish tutti-v${{ env.VERSION }} and refresh tutti-channel
        run: |
          set -euo pipefail
          MAC="out/Tutti-${VERSION}-mac.zip"
          WIN="out/Tutti-${VERSION}-windows.zip"
          BASE="https://github.com/${GH_REPO}/releases/download/tutti-v${VERSION}"
          python3 tools/release/make_manifest.py --version "$VERSION" --build "$BUILD" --commit "${{ github.sha }}" \
            --notes-file notes.md \
            --asset "mac=$MAC=$BASE/Tutti-${VERSION}-mac.zip" \
            --asset "windows=$WIN=$BASE/Tutti-${VERSION}-windows.zip" \
            --suggestions suggestions/endpoint.txt > out/tutti-update.json
          cat out/tutti-update.json

          gh release create "tutti-v${VERSION}" --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Tutti ${VERSION}" --notes-file notes.md \
            "$MAC" "$WIN" out/Tutti-Installer.pkg out/Tutti-Installer.exe

          if ! gh release view tutti-channel >/dev/null 2>&1; then
            gh release create tutti-channel --target "${{ github.sha }}" --prerelease --latest=false \
              --title "Tutti (latest build)" --notes "Tutti's install links and update feed."
          fi
          {
            echo "## Tutti ${VERSION}"
            echo
            echo "Edit one Ableton Live song together, live."
            echo
            echo "**Install on a Mac:** [Tutti-Installer.pkg](https://github.com/${GH_REPO}/releases/download/tutti-channel/Tutti-Installer.pkg). The first time only, macOS asks you to approve it: open **System Settings > Privacy & Security** and click **Open Anyway**."
            echo
            echo "**Install on Windows:** [Tutti-Installer.exe](https://github.com/${GH_REPO}/releases/download/tutti-channel/Tutti-Installer.exe). If Windows says it protected your PC, click **More info > Run anyway**."
            echo
            echo "Then follow the [setup guide](https://github.com/${GH_REPO}/blob/tutti/docs/SETUP.md) (about ten minutes, once). Tutti keeps itself up to date."
            echo
            echo "### What's new"
            cat notes.md
          } > channel-notes.md
          gh release edit tutti-channel --notes-file channel-notes.md --prerelease --latest=false
          gh release upload tutti-channel out/Tutti-Installer.pkg out/Tutti-Installer.exe out/tutti-update.json --clobber
          echo "Published Tutti ${VERSION}"
