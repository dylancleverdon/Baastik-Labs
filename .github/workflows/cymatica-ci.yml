# Build + test only (never publishes): pull requests into `cymatica`, and Claude session branches
# that carry Cymatica's code.
name: Cymatica CI

on:
  pull_request:
    branches: [cymatica]
  push:
    branches: ['claude/**']
  workflow_dispatch:

concurrency:
  group: cymatica-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/cymatica-build.yml
    with:
      publish: false
