[package]
name = "cymatica-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cymatica"
path = "src/main.rs"

[dependencies]
cymatica-audio.workspace = true
cymatica-engine.workspace = true
cymatica-update.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
image.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSScreen", "NSApplication", "NSResponder", "NSWorkspace", "NSGraphics"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-core-graphics = "0.3"
block2 = "0.6"
