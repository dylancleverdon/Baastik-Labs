name: Serum Preset Generator

# Everything here is scoped to this one plugin: its own paths, version,
# GitHub environment and release channel ("serum-preset-generator-latest").
# Other plugins in the repo get their own workflow, so a change to one never
# rebuilds, releases or auto-updates another.
#
# Every push that touches this plugin builds and tests it. Pushes to the
# plugin's own branches (serum-preset-generator*, claude/serum-preset-generator*,
# release/serum-preset-generator) or `main`, and manual runs, also publish:
#   - code changed    -> new installers + update.json (plugins offer the update)
#   - content changed -> new content.json only (plugins pull it silently, no reinstall)

on:
  push:
    paths:
      - "plugins/SerumPresetGenerator/**"
      - "libs/serum2/**"
      - "modules/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "tests/**"
      - "tools/serumtool/**"
      - "tools/release/**"
      - "packaging/serum-preset-generator/**"
      - ".github/workflows/serum-preset-generator.yml"
  pull_request:
    paths:
      - "plugins/SerumPresetGenerator/**"
      - "libs/serum2/**"
      - "modules/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "tests/**"
      - "tools/serumtool/**"
      - "tools/release/**"
      - "packaging/serum-preset-generator/**"
      - ".github/workflows/serum-preset-generator.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release from this branch
        type: boolean
        default: true
      force_build:
        description: Build new installers even if only content changed
        type: boolean
        default: false

concurrency:
  group: serum-preset-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLUGIN_ID: serum-preset-generator
  CHANNEL: serum-preset-generator-latest
  PRODUCT: Serum Preset Generator
  FILE_STEM: SerumPresetGenerator
  ARTEFACTS: build/plugins/SerumPresetGenerator/SerumPresetGenerator_artefacts/Release

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      content_version: ${{ steps.plan.outputs.content_version }}
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
      content_only: ${{ steps.plan.outputs.content_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_FORCE: ${{ inputs.force_build }}
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          base_version=$(tr -d '[:space:]' < plugins/SerumPresetGenerator/VERSION)
          version="$base_version.$RUN"

          # Pushes to this plugin's own branches publish; anything else only
          # builds and tests.
          publish=false
          if [[ "$EVENT" == "workflow_dispatch" && "$INPUT_PUBLISH" == "true" ]]; then publish=true; fi
          if [[ "$EVENT" == "push" ]]; then
            case "$REF" in
              refs/heads/main | refs/heads/release/serum-preset-generator | \
              refs/heads/serum-preset-generator* | refs/heads/claude/serum-preset-generator*)
                publish=true ;;
            esac
          fi

          # What changed since the last published release of this plugin?
          code_changed=true
          content_changed=true
          previous=$(curl -sfL "https://github.com/$REPO/releases/download/$CHANNEL/update.json" || true)
          previous_commit=$(jq -r '.commit // empty' <<< "${previous:-"{}"}" 2>/dev/null || true)
          if [[ -n "$previous_commit" ]] && git cat-file -e "$previous_commit^{commit}" 2>/dev/null; then
            code=$(git diff --name-only "$previous_commit" HEAD -- \
              plugins/SerumPresetGenerator libs/serum2 modules cmake CMakeLists.txt packaging/serum-preset-generator \
              ':(exclude)plugins/SerumPresetGenerator/Resources/content')
            content=$(git diff --name-only "$previous_commit" HEAD -- plugins/SerumPresetGenerator/Resources/content)
            [[ -z "$code" ]] && code_changed=false
            [[ -z "$content" ]] && content_changed=false
          fi
          [[ "$INPUT_FORCE" == "true" ]] && code_changed=true

          content_only=false
          if [[ "$publish" == "true" ]]; then
            if [[ "$code_changed" == "false" && "$content_changed" == "false" ]]; then
              echo "Nothing new since the last release; not publishing."
              publish=false
            elif [[ "$code_changed" == "false" ]]; then
              content_only=true
              version=$(jq -r '.version' <<< "$previous")
            fi
          fi

          # Branch and PR runs always build the installers to catch breakage.
          build=true
          [[ "$content_only" == "true" ]] && build=false

          {
            echo "version=$version"
            echo "content_version=$RUN"
            echo "publish=$publish"
            echo "build=$build"
            echo "content_only=$content_only"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version content=$RUN publish=$publish build=$build content_only=$content_only"

  test:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBAASTIK_BUILD_PLUGINS=OFF
          -DSERUMGEN_CONTENT_VERSION=${{ needs.plan.outputs.content_version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the generator
        run: |
          tool=build/tools/serumtool/serumtool
          $tool gen --mode random --count 25 --seed 1 --quiet --out out
          $tool gen --genre any --count 100 --seed 1000 --quiet --out out
          for f in out/*.SerumPreset; do $tool dump "$f" > /dev/null; done
          echo "$(ls out | wc -l) presets generated and decoded"

      - name: Content bundle
        run: build/tools/serumtool/serumtool content-bundle content.json

      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content.json

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-14
    env:
      HAS_SIGNING_CERTS: ${{ secrets.MACOS_CERTS_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBAASTIK_BUILD_TESTS=OFF -DBAASTIK_BUILD_TOOLS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DSPG_VERSION=${{ needs.plan.outputs.version }}
          -DSERUMGEN_CONTENT_VERSION=${{ needs.plan.outputs.content_version }}

      - name: Build
        run: >
          cmake --build build --config Release --parallel
          --target SerumPresetGenerator_VST3 SerumPresetGenerator_AU SerumPresetGenerator_Standalone

      - name: Import signing certificates
        if: env.HAS_SIGNING_CERTS == 'true'
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Package
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p dist
          packaging/serum-preset-generator/macos/build_pkg.sh "$ARTEFACTS" "${{ needs.plan.outputs.version }}" \
            "dist/$FILE_STEM-${{ needs.plan.outputs.version }}-macOS.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.pkg

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBAASTIK_BUILD_TESTS=OFF -DBAASTIK_BUILD_TOOLS=OFF
          -DSPG_VERSION=${{ needs.plan.outputs.version }}
          -DSERUMGEN_CONTENT_VERSION=${{ needs.plan.outputs.content_version }}

      - name: Build
        run: >
          cmake --build build --config Release --parallel
          --target SerumPresetGenerator_VST3 SerumPresetGenerator_Standalone

      - name: Package
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = "${{ needs.plan.outputs.version }}"
          & $iscc "/DAppVersion=$version" "/DArtefacts=$env:GITHUB_WORKSPACE\$($env:ARTEFACTS -replace '/', '\')" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" "/DOutputName=$env:FILE_STEM-$version-Windows" `
            packaging\serum-preset-generator\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe

  release:
    needs: [plan, test, macos, windows]
    if: >
      always() && needs.plan.outputs.publish == 'true' && needs.test.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    environment: serum-preset-generator
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      CONTENT_VERSION: ${{ needs.plan.outputs.content_version }}
      CONTENT_ONLY: ${{ needs.plan.outputs.content_only }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          notes=$(git log -1 --pretty=%s)

          # The channel release holds the files plugins read. Create it once.
          if ! gh release view "$CHANNEL" > /dev/null 2>&1; then
            gh release create "$CHANNEL" --target "$sha" --latest=false \
              --title "$PRODUCT (latest)" \
              --notes "Always the newest $PRODUCT. The plugin reads update.json from here; the installers below are the one-click downloads."
          fi

          if [[ "$CONTENT_ONLY" == "true" ]]; then
            curl -sfL "https://github.com/$repo/releases/download/$CHANNEL/update.json" -o previous.json
            python3 tools/release/make_manifest.py --plugin "$PLUGIN_ID" --repo "$repo" \
              --previous previous.json --content-version "$CONTENT_VERSION" --commit "$sha" > dist/update.json
            gh release upload "$CHANNEL" dist/update.json dist/content.json --clobber
            echo "Published content v$CONTENT_VERSION (installers unchanged at $VERSION)"
            exit 0
          fi

          tag="$PLUGIN_ID-v$VERSION"
          mac="$FILE_STEM-$VERSION-macOS.pkg"
          win="$FILE_STEM-$VERSION-Windows.exe"
          gh release create "$tag" --target "$sha" --latest=false \
            --title "$PRODUCT $VERSION" --notes "$notes" \
            "dist/$mac" "dist/$win"

          python3 tools/release/make_manifest.py --plugin "$PLUGIN_ID" --repo "$repo" \
            --version "$VERSION" --tag "$tag" --mac "$mac" --windows "$win" \
            --content-version "$CONTENT_VERSION" --commit "$sha" --notes "$notes" > dist/update.json

          # Stable names for the "always latest" download links.
          cp "dist/$mac" "dist/$FILE_STEM-macOS.pkg"
          cp "dist/$win" "dist/$FILE_STEM-Windows.exe"
          gh release upload "$CHANNEL" --clobber \
            dist/update.json dist/content.json "dist/$FILE_STEM-macOS.pkg" "dist/$FILE_STEM-Windows.exe"
          echo "Published $PRODUCT $VERSION"
